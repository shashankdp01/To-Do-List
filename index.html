<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <title>To-Do List</title>
</head>

<body>

  <div class="container">
    <header>
      <h1>To‑Do List</h1>
      <p class="instructions">Add a Task.</p>
    </header>

    <div class="input-section">
      <input id="taskInput" type="text" placeholder="Add a task..." class="input" />
      <button id="addBtn" class="btn">Add Task</button>
    </div>

    <ul id="taskList" class="todos-list"></ul>
  </div>

  <script src="app.js"></script>
</body>

</html>
